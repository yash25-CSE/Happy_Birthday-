<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#211631">
  <title>Our Little Memory Lane 📸</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&family=Sacramento&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/main.js" defer></script>
  <script src="js/gallery.js" defer></script>
</head>
<body class="scene-page gallery-page">
  <div class="ambient ambient-one"></div><div class="ambient ambient-two"></div>
  <div class="star-field" aria-hidden="true"></div>
  <main class="gallery-shell">
    <a class="back-link" href="page3.html">← Back to your surprise</a>
    <p class="script-kicker">Little moments, big feelings</p>
    <h1 class="page-title">A Little Journey Through<br><span class="gradient-text">Our Memories</span> 💖</h1>
    <p class="page-copy gallery-intro">Every picture tells a story, and every story reminds me how lucky I am to have you as my friend.</p>
    <div class="gallery-grid" data-gallery>
      <button class="memory-card memory-tall" type="button" data-kind="image" data-src="assets/photos/memory1.jpg" data-caption="One of those moments worth keeping">
        <img src="assets/photos/memory1.jpg" alt="Memory 1" loading="lazy"><span class="memory-caption"><small>MEMORY 01</small><strong>One for the heart ♡</strong></span>
      </button>
      <button class="memory-card" type="button" data-kind="image" data-src="assets/photos/memory2.jpg" data-caption="A little happiness, frozen in time">
        <img src="assets/photos/memory2.jpg" alt="Memory 2" loading="lazy"><span class="memory-caption"><small>MEMORY 02</small><strong>Good times ✨</strong></span>
      </button>
      <button class="memory-card memory-wide" type="button" data-kind="image" data-src="assets/photos/memory3.jpg" data-caption="The kind of day we will talk about again">
        <img src="assets/photos/memory3.jpg" alt="Memory 3" loading="lazy"><span class="memory-caption"><small>MEMORY 03</small><strong>Our kind of chaos 💗</strong></span>
      </button>
      <button class="memory-card" type="button" data-kind="image" data-src="assets/photos/memory4.jpg" data-caption="Proof that the little things matter">
        <img src="assets/photos/memory4.jpg" alt="Memory 4" loading="lazy"><span class="memory-caption"><small>MEMORY 04</small><strong>Little things, forever</strong></span>
      </button>
      <button class="memory-card memory-tall" type="button" data-kind="image" data-src="assets/photos/memory5.jpg" data-caption="A memory that still makes me smile">
        <img src="assets/photos/memory5.jpg" alt="Memory 5" loading="lazy"><span class="memory-caption"><small>MEMORY 05</small><strong>Still smiling 🌷</strong></span>
      </button>
      <button class="memory-card" type="button" data-kind="image" data-src="assets/photos/memory6.jpg" data-caption="Another page in our little story">
        <img src="assets/photos/memory6.jpg" alt="Memory 6" loading="lazy"><span class="memory-caption"><small>MEMORY 06</small><strong>Our little story</strong></span>
      </button>
      <button class="memory-card" type="button" data-kind="image" data-src="assets/photos/memory7.jpg" data-caption="More memories still to come">
        <img src="assets/photos/memory7.jpg" alt="Memory 7" loading="lazy"><span class="memory-caption"><small>MEMORY 07</small><strong>To more adventures ✨</strong></span>
      </button>
      <button class="memory-card" type="button" data-kind="image" data-src="assets/photos/memory8.jpg" data-caption="A favorite moment, with a favorite person">
        <img src="assets/photos/memory8.jpg" alt="Memory 8" loading="lazy"><span class="memory-caption"><small>MEMORY 08</small><strong>Favorite person energy ♡</strong></span>
      </button>
      <button class="memory-card video-card" type="button" data-kind="video" data-src="assets/videos/memory1.mp4" data-caption="A little video memory">
        <span class="video-thumb video-thumb-one"><span class="play-icon">▶</span></span><span class="memory-caption"><small>VIDEO 01</small><strong>Press play for a memory 🎬</strong></span>
      </button>
      <button class="memory-card video-card" type="button" data-kind="video" data-src="assets/videos/memory2.mp4" data-caption="One more moment to replay">
        <span class="video-thumb video-thumb-two"><span class="play-icon">▶</span></span><span class="memory-caption"><small>VIDEO 02</small><strong>A moment in motion ✨</strong></span>
      </button>
    </div>
    <div class="gallery-footer">
      <p class="script-signoff">The best memories are still ahead of us. ♡</p>
      <a class="magic-button" href="page5.html">One Last Birthday Wish <span aria-hidden="true">🎁</span></a>
    </div>
  </main>

  <div class="viewer is-hidden" data-viewer role="dialog" aria-modal="true" aria-label="Memory viewer">
    <button class="viewer-close" type="button" data-viewer-close aria-label="Close memory viewer">×</button>
    <button class="viewer-arrow viewer-prev" type="button" data-viewer-prev aria-label="Previous memory">‹</button>
    <div class="viewer-content" data-viewer-content></div>
    <button class="viewer-arrow viewer-next" type="button" data-viewer-next aria-label="Next memory">›</button>
    <div class="viewer-bottom"><p data-viewer-caption></p><button class="back-to-memories" type="button" data-viewer-back>← Back to Memories</button></div>
  </div>
</body>
</html>
